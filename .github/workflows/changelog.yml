name: Changelog

# A PR adds its CHANGELOG entry as a fragment in changelog.d/ (see its README).
# This check fails a PR that adds none, unless the PR carries the
# `skip-changelog` label. It is its own workflow so that adding or removing the
# label re-runs only this check, not the whole CI pipeline.
#
# A fragment is named after its PR number, so a PR opens without one. The PR
# opens as a draft, gets its fragment or label, then is marked ready: the check
# skips while the PR is a draft and runs on ready_for_review, so the first run
# does not fail on a fragment that cannot exist yet.
"on":
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, labeled, unlabeled, ready_for_review ]

permissions:
  contents: read

jobs:
  fragment:
    if: ${{ !github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      with:
        fetch-depth: 0  # towncrier diffs against the base branch; setuptools-scm needs the tags

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.x"  # any version runs towncrier

    - name: Install towncrier
      run: |
        python -m pip install --upgrade pip
        pip install ".[changelog]"

    - name: Check for a changelog fragment
      run: towncrier check --compare-with "origin/${{ github.base_ref }}"
