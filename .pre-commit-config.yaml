# `pre-commit install` sets up both hook types; the formatting and lint hooks run on
# commit, the type check (about a minute) runs on push.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        files: ^pandas_ta_classic/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      # Same gate as CI: `ruff check` with [tool.ruff.lint], on every changed file.
      - id: ruff-check

  - repo: local
    hooks:
      - id: gen-core-stub
        name: Regenerate core.pyi
        entry: bash -c 'python tools/gen_core_stub.py && ruff check --fix --quiet pandas_ta_classic/core.pyi && black --quiet pandas_ta_classic/core.pyi'
        language: system
        pass_filenames: false
        files: ^pandas_ta_classic/.+\.py$

      # Same type check as CI's code-quality job (`make typecheck`: the package, then
      # core.py on its own because core.pyi shadows it).
      - id: mypy-typecheck
        name: Type-check (make typecheck)
        entry: make typecheck
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]
